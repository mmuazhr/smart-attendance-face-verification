[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "presenceguard"
version = "0.2.0"
description = "Privacy-first, on-device face verification for attendance research"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Muaz Husaini"}]
dependencies = [
  "cryptography>=43,<51",
  "fastapi>=0.116,<1",
  "numpy>=1.26,<3",
  "opencv-contrib-python-headless>=4.10,<5",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
presenceguard = "presenceguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/presenceguard"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
  "private_model: requires Git-ignored model weights and face data",
]

[tool.coverage.run]
# The OpenCV model adapter is exercised by the opt-in private-model smoke test. Public CI
# intentionally has no biometric weights, so keep model-dependent integration coverage out of
# the aggregate threshold while retaining the explicit smoke-test boundary.
omit = ["src/presenceguard/face.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E501", "S311"]
"tests/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
